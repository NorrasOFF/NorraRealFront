app = 'openfrontio'
primary_region = 'ams'

[build]

[[mounts]]
  source = "openfront_auth"
  destination = "/data"

[env]
  GAME_ENV = "dev"
  LOCAL_AUTH = "1"
  AUTH_DIR = "/data/auth"
  # Resumable private/ranked saves live on the /data volume so they survive a
  # deploy or machine replacement. Auth keeps /data/auth; the save budget is
  # deliberately below the 1 GB volume so prune() never eats auth's headroom.
  SAVE_DIR = "/data/saves"
  SAVE_DIR_BUDGET_BYTES = "805306368"
  DOMAIN = "openfrontio.fly.dev"
  SUBDOMAIN = "main"
  NUM_WORKERS = "1"
  TURNSTILE_SITE_KEY = "disabled"
  CDN_BASE = "https://openfrontio.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # A hung Node master leaves the container's nginx accepting connections and
  # waiting 60 s before a 504, so the site looks frozen and never recovers on
  # its own. These checks make Fly see that state and restart the machine.
  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
# auto-deploy test
